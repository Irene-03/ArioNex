# ================================================================
#   تنظیمات وب‌سرور Nginx برای فرانت‌اند آریونکس (ArioNex Nginx Config)
#   جهت پشتیبانی از روت‌های SPA ری‌اکت و کش مناسب متادیتای ایستا
# ================================================================

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # لایه بررسی روتینگ SPA: در صورت عدم وجود آدرس، index.html برگردانده شود
        try_files $uri $uri/ /index.html;
    }

    # کشینگ المان‌های ایستا و لوگوها جهت بهینه‌سازی سرعت بارگذاری
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|otf)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # مدیریت خطاهای سیستمی وب‌سرور
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
