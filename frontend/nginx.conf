# ================================================================
#   ArioNex frontend Nginx web server configuration (ArioNex Nginx Config)
#   Supports React SPA routes and proper caching of static assets
# ================================================================

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Prevent caching of index.html so the browser always fetches the latest bundle
        add_header Cache-Control "no-cache, must-revalidate";
        # SPA routing fallback: if the path is not found, serve index.html
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets and logos to optimize load speed
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|otf)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Handle web server system errors
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
