# ----------------------------------------------------
# پیکربندی پویای سیستم هوشمند آریونکس (ArioNex Configuration)
# این فایل مدیریت روشن/خاموش بودن تمامی سرویس‌ها را بر عهده دارد
# ----------------------------------------------------

services:
  # پردازشگر اسناد بدون ساختار (فایل‌های متنی، PDF، Word)
  unstructured_document_processor:
    enabled: true

  # پردازشگر پرسش و پاسخ‌های پشتیبانی (سوالات متداول FAQ)
  qna_processor:
    enabled: true

  # پردازشگر فایل‌های لاگ سیستمی
  log_processor:
    enabled: true

  # تحلیلگر داده‌های ساختاریافته (CSV و تراکنش‌های حسابداری)
  structured_data_analytics:
    enabled: true

  # جستجوی زنده وب (با استفاده از Tavily API)
  web_search:
    enabled: true

  # کرالر وب‌سایت — استخراج محتوای صفحات برای RAG
  web_crawler:
    enabled: true

  # استخراج‌کننده موجودیت‌ها (بخش گراف دانش) - فعلا در فازهای بعدی فعال می‌شود
  entity_extractor:
    enabled: false

  # استخراج‌کننده قوانین کسب‌وکار (بخش گراف دانش) - فعلا در فازهای بعدی فعال می‌شود
  rule_extractor:
    enabled: false

  # دیتابیس گرافی نئو فور جی (Neo4j)
  neo4j:
    enabled: false

  # بازرس محلی ایمنی (Local Gemma-2b Auditor) - در فازهای بعدی مستقر خواهد شد
  safety_auditor:
    enabled: false

integrations:
  # فعال بودن ربات تلگرام سازمانی
  telegram_bot:
    enabled: true
    
  # فعال بودن ویجت پاپ‌آپ وب‌سایت
  popup_widget:
    enabled: true
    
  # فعال بودن خروجی وب‌سرویس REST API
  rest_api:
    enabled: true

security:
  # فعال بودن ماسک خودکار اطلاعات شخصی (PII Redaction)
  pii_redaction:
    enabled: true
    
  # قانون سخت‌گیرانه عدم توهم و الزام استناد دقیق به منابع
  strict_non_hallucination:
    enabled: true

# وضعیت فعال/غیرفعال بودن پروایدرهای هوش مصنوعی
providers:
  openai:
    enabled: true
  openrouter:
    enabled: true
  anthropic:
    enabled: true
  google:
    enabled: true
  deepseek:
    enabled: true
  gapgpt:
    enabled: true
  avalai:
    enabled: true
  hormouz:
    enabled: true

# ----------------------------------------------------
# تنظیمات موتور کرالر وب (Web Crawler Engine Settings)
# ----------------------------------------------------
crawler:
  # رندر صفحات JavaScript (React/Vue/Angular) با استفاده از Playwright
  # هشدار: فعال کردن این گزینه نیاز به نصب playwright و chromium دارد
  js_render:
    enabled: false

  # دنبال کردن لینک‌های خارجی (خارج از دامنه اصلی)
  # با سختگیری زیاد — فقط دامنه‌های مرتبط و ارزشمند دنبال می‌شوند
  follow_external_domains:
    enabled: false

  # حداکثر تعداد صفحات پیش‌فرض برای هر job کرال
  default_max_pages:
    value: 50

  # حداکثر عمق لینک از URL ریشه
  default_max_depth:
    value: 3

  # تعداد درخواست‌های HTTP همزمان
  default_concurrency:
    value: 5

  # تاخیر بین هر درخواست HTTP (میلی‌ثانیه) — رعایت ادب با سرور هدف
  request_delay_ms:
    value: 300

  # لیست دستی پروکسی‌ها برای چرخش و دور زدن ضدبات‌ها (فرمت منعطف و قابل توسعه در آینده)
  # ساختار: لیستی از رشته‌های URL پروکسی
  proxy_pool: []
