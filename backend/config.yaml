# ----------------------------------------------------
# Dynamic configuration of the ArioNex smart system (ArioNex Configuration)
# This file manages enabling/disabling all services
# ----------------------------------------------------

services:
  # Unstructured document processor (text files, PDF, Word)
  unstructured_document_processor:
    enabled: true

  # Unlimited-OCR (baidu/Unlimited-OCR) served via vLLM/SGLang.
  # Disabled by default: keep this false until an OpenAI-compatible OCR server
  # is reachable at `base_url`. When disabled, PaddleOCR remains the fallback.
  unlimited_ocr:
    enabled: false
    base_url: "http://localhost:8000"
    model_name: "baidu/Unlimited-OCR"
    image_mode: "gundam"

  # Support Q&A processor (FAQ)
  qna_processor:
    enabled: true

  # System log file processor
  log_processor:
    enabled: true

  # Structured data analytics (CSV and accounting transactions)
  structured_data_analytics:
    enabled: true

  # Live web search (using the Tavily API)
  web_search:
    enabled: true

  # Web crawler — extracts page content for RAG
  web_crawler:
    enabled: true

  # Entity extractor (knowledge graph section)
  entity_extractor:
    enabled: false

  # Business rule extractor (knowledge graph section)
  rule_extractor:
    enabled: false

  # Neo4j graph database (Neo4j)
  neo4j:
    enabled: false

  # Local safety auditor (Local Gemma-2b Auditor) - will be deployed in later phases
  safety_auditor:
    enabled: false

integrations:
  # Whether the organizational Telegram bot is enabled
  telegram_bot:
    enabled: true
    
  # Whether the website popup widget is enabled
  popup_widget:
    enabled: true
    
  # Whether the REST API web service output is enabled
  rest_api:
    enabled: true

security:
  # Whether automatic PII redaction is enabled (PII Redaction)
  pii_redaction:
    enabled: true
    
  # Strict no-hallucination policy and the requirement to cite sources accurately
  strict_non_hallucination:
    enabled: false

# Enabled/disabled status of AI providers
providers:
  openai:
    enabled: true
  openrouter:
    enabled: true
  anthropic:
    enabled: true
  google:
    enabled: true
  deepseek:
    enabled: true
  gapgpt:
    enabled: true
  avalai:
    enabled: true
  hormouz:
    enabled: true
  ollama:
    enabled: false

# ----------------------------------------------------
# Web crawler engine settings (Web Crawler Engine Settings)
# ----------------------------------------------------
crawler:
  # Render JavaScript pages (React/Vue/Angular) using Playwright
  # Warning: enabling this option requires installing playwright and chromium
  js_render:
    enabled: true

  # Follow external links (outside the main domain)
  # With high strictness — only related and valuable domains are followed
  follow_external_domains:
    enabled: false

  # Default maximum number of pages per crawl job
  default_max_pages:
    value: 50

  # Maximum link depth from the root URL
  default_max_depth:
    value: 3

  # Number of concurrent HTTP requests
  default_concurrency:
    value: 5

  # Delay between each HTTP request (milliseconds) — being polite to the target server
  request_delay_ms:
    value: 300

  # Maximum execution time of a crawl job (seconds) — to prevent the server from locking up
  job_timeout_seconds:
    value: 3600

  # Manual proxy list for rotation and bypassing anti-bot measures (flexible format, extensible in the future)
  # Structure: a list of proxy URL strings
  proxy_pool: []

# ========== LLM and Embedding Providers ==========
jwt_secret_key: "arionex_jwt_secret_2026_secure"
password_salt: "arionex_fixed_salt_2026_secure"
env: "development"
hormouz_embedding_model: "openai/text-embedding-3-large"
embedding_provider: "hormouz"
# Local (offline) mode is OFF by default: chat LLM uses the external provider below.
llm_provider: "openrouter"
model_name: "openai/gpt-4o-mini"
ollama_base_url: "http://localhost:11434"
ollama_model: "deepseek-r1:1.5b"
