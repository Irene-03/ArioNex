# ================================================================
#   ارکستریشن چندکانتینری هوشمند آریونکس (ArioNex Docker Compose)
#   مدیریت و اتصال دیتابیس برداری، استوریج، فرانت‌اند و بک‌اند
# ================================================================

version: '3.8'

services:
  # پایگاه داده برداری رسمی سیستم (PostgreSQL + pgvector)
  db:
    image: pgvector/pgvector:pg16
    container_name: arionex-vector-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # سرویس آبجکت استوریج کانتینری (MinIO Cloud Simulator)
  minio:
    image: minio/minio
    container_name: arionex-minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # صف پیام‌ها و حافظه موقت سلری (Redis Broker)
  redis:
    image: redis:7-alpine
    container_name: arionex-redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # وب‌سرور و موتور هوش مصنوعی بک‌اند (FastAPI Backend)
  backend:
    build: ./backend
    container_name: arionex-backend
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
      - MINIO_BUCKET_NAME=arionex-raw-files
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=
      - MODEL_NAME=gpt-4o-mini
      - TAVILY_API_KEY=
      - TELEGRAM_BOT_TOKEN=
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # پردازشگر پس‌زمینه تسک‌های غیرهمزمان کرالر (Celery Worker)
  celery_worker:
    build: ./backend
    container_name: arionex-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
      - MINIO_BUCKET_NAME=arionex-raw-files
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=
      - MODEL_NAME=gpt-4o-mini
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always


  # کلاینت داشبورد مدیریتی فرانت‌اند (Nginx Served React Application)
  frontend:
    build: ./frontend
    container_name: arionex-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
